name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Create full Flutter project structure
      run: |
        # إنشاء مشروع مؤقت كامل بكل مجلدات الأندرويد والـ Gradle
        flutter create temp_app --org com.example --project-name admin_app --platforms=android
        
        # نقل ملفاتك الحقيقية (main.dart و pubspec.yaml) إلى المشروع الجديد
        cp -r lib/* temp_app/lib/
        cp pubspec.yaml temp_app/pubspec.yaml
        
        # الدخول للمشروع المؤقت لبناء الـ APK منه
        cd temp_app
        flutter pub get
        flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: temp_app/build/app/outputs/flutter-apk/app-release.apk
